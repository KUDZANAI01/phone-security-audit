<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Phone Security Audit</title>
  <desc id="desc">A mobile device with a shield and permission indicators</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="960" cy="150" r="140" fill="#0ea5e9" opacity="0.12"/>
  <circle cx="230" cy="570" r="180" fill="#14b8a6" opacity="0.08"/>

  <g transform="translate(180,120)">
    <rect x="0" y="0" width="330" height="470" rx="36" fill="url(#panel)" stroke="#2dd4bf" stroke-width="4"/>
    <rect x="42" y="38" width="246" height="394" rx="24" fill="#0b1120"/>
    <circle cx="165" cy="326" r="44" fill="url(#accent)" opacity="0.9"/>
    <path d="M148 316 L159 328 L183 301" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="58" y="76" width="214" height="26" rx="10" fill="#1f2937"/>
    <rect x="68" y="124" width="80" height="12" rx="6" fill="#34d399" opacity="0.9"/>
    <rect x="68" y="154" width="120" height="12" rx="6" fill="#2dd4bf" opacity="0.8"/>
    <rect x="68" y="182" width="95" height="12" rx="6" fill="#38bdf8" opacity="0.8"/>

    <rect x="70" y="220" width="180" height="14" rx="7" fill="#334155"/>
    <rect x="70" y="246" width="160" height="14" rx="7" fill="#334155"/>
    <rect x="70" y="272" width="190" height="14" rx="7" fill="#334155"/>
  </g>

  <g transform="translate(620,150)">
    <path d="M180 70 L330 120 L330 260 L180 320 L30 260 L30 120 Z" fill="url(#accent)" opacity="0.9"/>
    <path d="M180 110 L290 150 L290 230 L180 275 L70 230 L70 150 Z" fill="#0f172a" opacity="0.9"/>
    <path d="M180 175 L220 190 L180 206 L140 190 Z" fill="#d1fae5"/>
    <path d="M180 80 L180 300" stroke="#d1fae5" stroke-width="8" opacity="0.7"/>
    <circle cx="180" cy="195" r="38" fill="#f8fafc" opacity="0.12"/>
  </g>

  <g transform="translate(700,380)">
    <rect x="0" y="0" width="270" height="110" rx="20" fill="#0b1120" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="42" cy="40" r="16" fill="#34d399"/>
    <text x="72" y="46" font-family="Arial, sans-serif" font-size="26" fill="#f8fafc" font-weight="700">Secure</text>
    <text x="40" y="78" font-family="Arial, sans-serif" font-size="22" fill="#cbd5e1">Privacy Review</text>
  </g>

  <text x="620" y="120" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">Phone Security Audit</text>
  <text x="620" y="170" font-family="Arial, sans-serif" font-size="24" fill="#cbd5e1">Lawful privacy review and permission checks</text>
</svg>
